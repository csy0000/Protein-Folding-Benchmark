models:
  esmfold:
    enabled: true
    runner: bash runners/run_esmfold.sh
    msa_used: false
    msa_source: none
    msa_mode: native_single_sequence
    msa_database: none
    msa_generation_included_in_timing: false
    msa_generation_included_in_carbon: false
    msa_reused: false

  omegafold:
    enabled: true
    runner: bash runners/run_omegafold.sh
    msa_used: false
    msa_source: none
    msa_mode: native_single_sequence
    msa_database: none
    msa_generation_included_in_timing: false
    msa_generation_included_in_carbon: false
    msa_reused: false

  boltz2:
    enabled: true
    runner: bash runners/run_boltz2.sh
    msa_used: false
    msa_source: none
    msa_mode: model_default_no_msa
    msa_database: none
    msa_generation_included_in_timing: false
    msa_generation_included_in_carbon: false
    msa_reused: false

  chai1:
    enabled: true
    runner: bash runners/run_chai1.sh
    msa_used: unknown
    msa_source: unknown
    msa_mode: model_default_unknown
    msa_notes: "MSA usage not confirmed from Chai-1 runner/logs; runner passes FASTA only"

  colabfold:
    enabled: true
    runner: env COLABFOLD_MSA_MODE=mmseqs2_uniref_env COLABFOLD_MODEL_NAME=colabfold COLABFOLD_DB=/data/chen/protein_folding_databases/colabfold COLABFOLD_MMSEQS=/data/chen/software/mmseqs/bin/mmseqs COLABFOLD_SEARCH_GPU=1 bash runners/run_colabfold.sh
    msa_used: true
    msa_source: colabfold_mmseqs2
    msa_mode: default_msa
    msa_database: colabfold
    msa_database_path: /data/chen/protein_folding_databases/colabfold
    msa_generation_included_in_timing: true
    msa_generation_included_in_carbon: true
    msa_reused: false

  openfold:
    enabled: true
    runner: env OPENFOLD_DEVICE=cuda:0 COLABFOLD_DB=/data/chen/protein_folding_databases/colabfold COLABFOLD_MMSEQS=/data/chen/software/mmseqs/bin/mmseqs COLABFOLD_SEARCH_GPU=1 bash runners/run_openfold_msa.sh
    msa_used: true
    msa_source: colabfold_mmseqs2
    msa_mode: default_msa
    msa_database: colabfold
    msa_database_path: /data/chen/protein_folding_databases/colabfold
    msa_generation_included_in_timing: true
    msa_generation_included_in_carbon: true
    msa_reused: false

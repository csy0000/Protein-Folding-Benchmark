models:
  openfold_single:
    enabled: true
    runner: env OPENFOLD_MODE=single_sequence OPENFOLD_DEVICE=cuda:0 bash runners/run_openfold.sh
    env_name: openfold
    notes: OpenFold explicit single-sequence smoke mode.
  openfold_msa:
    enabled: true
    runner: env OPENFOLD_DEVICE=cuda:0 COLABFOLD_DB=/data/chen/protein_folding_databases/colabfold COLABFOLD_MMSEQS=/data/chen/software/mmseqs/bin/mmseqs COLABFOLD_SEARCH_GPU=1 bash runners/run_openfold_msa.sh
    env_name: openfold
    notes: OpenFold inference with freshly generated ColabFold/MMseqs A3M alignments inside the timed/carbon-tracked runner.
